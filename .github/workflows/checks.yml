name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p learning-core --locked
      - run: npm run check:content
      - run: cargo test -p lang-desktop --locked
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run tauri -- build --debug --no-bundle
      - run: npm run test:native
      - run: cargo check -p lang-desktop --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-diagnostics-${{ matrix.os }}
          path: |
            test-results/native-status.json
            test-results/native-window.png
            test-results/native-profile-*/native.log
          if-no-files-found: ignore
          retention-days: 7
